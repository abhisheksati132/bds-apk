name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for direct download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/itas.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: itas-APK
          path: release-apk/itas.apk
          if-no-files-found: error

      - name: Create Direct GitHub Release (Raw .APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "itas Latest APK"
          body: "Direct APK build for itas. Download `itas.apk` below and install directly on your phone."
          files: release-apk/itas.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
